[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bookscreener"
version = "1.0.0"
description = "Screen Turkish books for content unsuitable for children with a fine-tuned BERTurk model"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Talha Çağrı Terzioğlu" }, { name = "Mehmet Emre Kesekoğlu" }]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "nltk>=3.8",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
model = ["torch>=2.1", "transformers>=4.41", "catboost>=1.2"]
train = ["bookscreener[model]", "datasets>=2.18", "accelerate>=0.26", "optuna>=3.5"]
app = ["bookscreener[model]", "gradio>=4.0", "pymupdf>=1.23", "reportlab>=4.0"]
dev = ["pytest>=8.0", "ruff>=0.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
